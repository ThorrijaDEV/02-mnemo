<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNEMO — memoria digital con asociación y olvido</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --line: #232b36;
      --text: #d5dee8; --dim: #7d8ea0; --accent: #58a6ff;
      --warm: #f2b565;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      border-bottom: 1px solid var(--line); background: var(--panel);
      flex-wrap: wrap;
    }
    header h1 { font-size: 15px; letter-spacing: .3px; }
    header h1 b { color: var(--accent); }
    .spacer { flex: 1; }
    .btn {
      background: #212936; border: 1px solid var(--line); color: var(--text);
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    .btn:hover { border-color: var(--accent); color: #fff; }
    .btn.primary { background: #12304a; border-color: #2b6f9f; }
    .search {
      display: flex; align-items: center; gap: 6px; padding: 8px 14px;
      border-bottom: 1px solid var(--line);
    }
    input[type=text], textarea {
      background: #101623; border: 1px solid var(--line); color: var(--text);
      border-radius: 6px; padding: 6px 9px; font-size: 13px; width: 100%;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    #wrap { flex: 1; display: flex; min-height: 0; }
    .stage { flex: 1; position: relative; min-width: 0; }
    canvas#graph { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hint { position: absolute; left: 10px; bottom: 8px; color: #5b6b7d; font-size: 11px; pointer-events: none; }
    #side {
      width: 330px; min-width: 330px; background: var(--panel);
      border-left: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column;
    }
    .section { padding: 10px 13px; border-bottom: 1px solid var(--line); }
    .section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-bottom: 8px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 12px; }
    .stats b { text-align: right; color: #fff; font-variant-numeric: tabular-nums; }
    .textarea-row { display: flex; gap: 6px; }
    textarea { flex: 1; resize: none; height: 52px; }
    .results { font-size: 12px; }
    .m {
      border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px;
      background: #101623;
    }
    .m .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .m .head b { color: var(--warm); font-size: 12px; }
    .m .head span { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
    .m .txt { color: var(--text); }
    .m .via { color: var(--dim); font-size: 11px; margin-top: 3px; }
    .m button { margin-top: 6px; font-size: 11px; padding: 2px 8px; }
    #toast {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: #12304a; color: #cfe8ff; border: 1px solid #2b6f9f;
      padding: 8px 16px; border-radius: 8px; font-size: 12px;
      opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 10;
    }
    .empty { color: var(--dim); font-size: 12px; }
    @media (max-width: 760px) {
      #wrap { flex-direction: column; }
      #side { width: 100%; min-width: 0; max-height: 42vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1><b>MNEMO</b> · memoria que recuerda por asociación y olvida lo que no usa</h1>
    <div class="spacer"></div>
    <button class="btn" id="btn-corpus">Cargar corpus de ejemplo</button>
    <button class="btn" id="btn-sueno">Sueño</button>
    <button class="btn" id="btn-olvido">Olvidar</button>
    <button class="btn" id="btn-export">Exportar</button>
    <button class="btn" id="btn-import">Importar</button>
    <input type="file" id="file-import" accept="application/json" hidden>
  </header>
  <div class="search">
    <input type="text" id="search" placeholder="¿Qué quieres recordar?" autocomplete="off">
    <button class="btn primary" id="btn-search">Buscar</button>
    <button class="btn" id="btn-recall">Asociar</button>
  </div>
  <div id="wrap">
    <div class="stage">
      <canvas id="graph"></canvas>
      <div class="hint">clic en un nodo = recordar ese concepto · 'Asociar' encadena recuerdos inesperados</div>
    </div>
    <div id="side">
      <div class="section">
        <h2>Nueva memoria</h2>
        <div class="textarea-row">
          <textarea id="mem-text" placeholder="Escribe un fragmento que quieras recordar…"></textarea>
          <button class="btn primary" id="btn-add" style="align-self:stretch;">Guardar</button>
        </div>
      </div>
      <div class="section">
        <h2>Estado de la memoria</h2>
        <div class="stats">
          <span>Memorias</span><b id="st-mem">0</b>
          <span>Conceptos</span><b id="st-concept">0</b>
          <span>Asociaciones</span><b id="st-assoc">0</b>
          <span>Ticks</span><b id="st-ticks">0</b>
        </div>
      </div>
      <div class="section">
        <h2>Resultados</h2>
        <div class="results" id="results"></div>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script src="js/core/lexer.js"></script>
  <script src="js/core/memory.js"></script>
  <script src="js/web.js"></script>
</body>
</html>
